[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dng-preflight"
version = "0.1.0"
description = "Interactive preflight and configuration tool for Cisco Duo Network Gateway (DNG)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mark Tripod" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "dnspython>=2.6",
    "psutil>=5.9",
    "cryptography>=42",
    "jinja2>=3.1",
    "questionary>=2.0",
    "click>=8.1",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "syrupy>=4",
    "ruff>=0.4",
    "ty",
    "pre-commit>=3.7",
    "types-pyyaml>=6",
]

[project.scripts]
dng-preflight = "dng_preflight.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dng_preflight"]
# Hatchling's default file selector ships every file inside the packages,
# including the *.j2 templates the generators load via Jinja2's PackageLoader.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "ANN", "ASYNC", "S", "PT", "RET"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101", "S106"]

[tool.ty]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
